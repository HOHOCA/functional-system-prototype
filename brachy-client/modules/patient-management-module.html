<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>患者管理 - MOZI Brachy</title>
    <link rel="stylesheet" href="../../shared/styles/styles.css?v=ui19">
    <link rel="stylesheet" href="../../shared/styles/patient-management.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            overflow: hidden;
        }
        
        .patient-management-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            background: #1a1a1a;
        }
        
        /* 主内容区域包装器 - 横向布局左右面板 */
        .main-content-wrapper {
            display: flex;
            flex-direction: row;
            flex: 1;
            min-height: 0;
            overflow: hidden;
            height: calc(100vh - 60px);
        }
        
        /* 左侧面板 */
        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        
        /* 右侧面板 */
        .right-panel {
            flex: 0 0 350px;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        
        /* 统一的底部操作栏 - 横跨整个容器 */
        .bottom-action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #2a2a2a;
            border-top: 1px solid #404040;
            flex-shrink: 0;
            height: 60px;
        }
        
        .bottom-action-bar .left-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .bottom-action-bar .right-actions {
            display: flex;
            gap: 2px;
            align-items: center;
        }
        
        .bottom-action-bar .btn {
            padding: 8px 16px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .bottom-action-bar .btn-primary {
            background: #249BD9;
            color: #fff;
        }
        
        .bottom-action-bar .btn-primary:hover {
            background: #2a9cc8;
        }
        
        .bottom-action-bar .btn-secondary {
            background: #404040;
            color: #ddd;
        }
        
        .bottom-action-bar .btn-secondary:hover {
            background: #505050;
        }
        
        .bottom-action-bar .btn-danger {
            background: #e53935;
            color: #fff;
        }
        
        .bottom-action-bar .btn-danger:hover {
            background: #c62828;
        }
        
        /* 患者摘要、搜索框、标签页 - 固定高度 */
        .patient-summary,
        .right-search,
        .right-tabs {
            flex-shrink: 0;
        }
        
        /* 序列树容器 - 占据剩余空间，滚动由 SequenceTreeComponent 内部处理 */
        .sequence-tree-container {
            flex: 1;
            overflow: hidden; /* 移除滚动，由组件内部处理 */
            min-height: 0;
        }
        
        /* 配准容器 */
        .registration-container {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
        }
        
        /* 文件信息 - 固定在右侧面板底部 */
        .file-info {
            flex-shrink: 0;
            border-top: 1px solid #404040;
            padding: 10px;
        }
        
        /* 序列树样式 - 纵向树，一行一个节点 */
        .sequence-tree {
            padding: 8px 12px;
            color: #ddd;
            font-size: 14px;
        }

        /* 纵向树的每一行 */
        .tree-line {
            display: flex;
            align-items: center;
            padding: 6px 0;
            cursor: pointer;
            transition: background 0.2s;
            border-radius: 3px;
            min-height: 32px;
            position: relative;
        }

        .tree-line:hover {
            background: #404040;
        }

        /* 根据层级缩进 */
        .tree-line.level-0 {
            padding-left: 0;
        }

        .tree-line.level-1 {
            padding-left: 20px;
        }

        .tree-line.level-2 {
            padding-left: 40px;
        }

        .tree-line.level-3 {
            padding-left: 60px;
        }

        .tree-line.level-4 {
            padding-left: 80px;
        }

        /* 树形连接线 - 垂直虚线 */
        .tree-line.level-1::before,
        .tree-line.level-2::before,
        .tree-line.level-3::before,
        .tree-line.level-4::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 0;
            bottom: 50%;
            width: 1px;
            border-left: 1px dashed #666;
        }

        /* 水平虚线连接到节点 */
        .tree-line.level-1::after,
        .tree-line.level-2::after,
        .tree-line.level-3::after,
        .tree-line.level-4::after {
            content: '';
            position: absolute;
            left: 10px;
            top: 50%;
            width: 10px;
            height: 1px;
            border-top: 1px dashed #666;
        }

        /* level-2 的线条位置调整 */
        .tree-line.level-2::before {
            left: 30px;
        }

        .tree-line.level-2::after {
            left: 30px;
        }

        /* level-3 的线条位置调整 */
        .tree-line.level-3::before {
            left: 50px;
        }

        .tree-line.level-3::after {
            left: 50px;
        }

        /* level-4 的线条位置调整 */
        .tree-line.level-4::before {
            left: 70px;
        }

        .tree-line.level-4::after {
            left: 70px;
        }

        /* 最后一个子节点不显示向下的垂直线 */
        .tree-line.last-child::before {
            display: none;
        }

        /* 选中状态 - 与患者列表一致 */
        .tree-line.selected {
            background-color: rgba(36, 155, 217, 0.2);
        }

        .tree-line.selected:hover {
            background-color: rgba(36, 155, 217, 0.3);
        }

        /* 展开/折叠按钮 */
        .tree-toggle {
            display: inline-block;
            width: 16px;
            height: 16px;
            line-height: 14px;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            color: #888;
            border: 1px solid #888;
            border-radius: 2px;
            margin-right: 8px;
            flex-shrink: 0;
        }

        /* 图标 */
        .tree-line i {
            margin-right: 8px;
            width: 16px;
            color: #249BD9;
            font-size: 14px;
            flex-shrink: 0;
        }

        .tree-line.selected i {
            color: #fff;
        }

        /* 文本 */
        .tree-line > span:not(.tree-toggle) {
            color: #ddd;
        }

        .tree-line.selected > span:not(.tree-toggle) {
            color: #fff;
        }
        
        /* 弹窗样式 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        
        .modal-dialog {
            background: #2a2a2a;
            border-radius: 8px;
            width: 700px;
            max-width: 90%;
            max-height: 90vh;
            overflow: auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        
        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid #404040;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-header h3 {
            margin: 0;
            color: #fff;
            font-size: 18px;
        }
        
        .modal-close {
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 20px;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: all 0.3s;
        }
        
        .modal-close:hover {
            background: #404040;
            color: #fff;
        }
        
        .modal-body {
            padding: 24px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            color: #ddd;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .form-input {
            width: 100%;
            padding: 10px 12px;
            background: #1a1a1a;
            border: 1px solid #404040;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #249BD9;
        }
        
        .form-input.readonly {
            background: #333;
            color: #888;
            cursor: not-allowed;
        }
        
        .form-hint {
            margin-top: 6px;
            color: #888;
            font-size: 12px;
        }
        
        .chart-section {
            margin-top: 24px;
        }
        
        .chart-section h4 {
            color: #fff;
            font-size: 16px;
            margin-bottom: 8px;
        }
        
        .chart-subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 16px;
        }
        
        .chart-placeholder {
            background: #1a1a1a;
            border: 1px solid #404040;
            border-radius: 4px;
            padding: 20px;
            min-height: 300px;
        }
        
        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid #404040;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="patient-management-container">
        <!-- 主内容区域 -->
        <div class="main-content-wrapper">
            <!-- 左侧患者列表 -->
            <div class="left-panel">
            <!-- 搜索栏 -->
            <div class="search-section">
                <div class="search-box">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" placeholder="请输入患者姓名或ID,点击搜索图标或按下回车键开始搜索" id="searchInput">
                </div>
                <div class="search-actions">
                    <i class="fas fa-sync-alt refresh-icon"></i>
                    <i class="fas fa-cog settings-icon"></i>
                </div>
            </div>

            <!-- 患者表格 -->
            <div class="table-section">
                <table class="patient-table">
                    <thead>
                        <tr>
                            <th><i class="fas fa-folder"></i></th>
                            <th>患者ID</th>
                            <th>姓名</th>
                            <th>性别</th>
                            <th>出生日期</th>
                            <th>年龄</th>
                            <th>医生</th>
                            <th>物理师</th>
                            <th>导入时间</th>
                            <th>保存时间</th>
                            <th>备注</th>
                        </tr>
                    </thead>
                    <tbody id="patientTableBody">
                        <!-- 患者数据将通过JavaScript动态加载 -->
                    </tbody>
                </table>
            </div>

            <!-- 分页控制 -->
            <div class="pagination-section">
                <span class="pagination-total">共399条</span>
                <select class="page-size-select">
                    <option value="20">20条/页</option>
                    <option value="50">50条/页</option>
                    <option value="100">100条/页</option>
                    <option value="200">200条/页</option>
                </select>
                <button class="page-btn page-prev" disabled>&lt;</button>
                <button class="page-btn page-num active">1</button>
                <button class="page-btn page-num">2</button>
                <button class="page-btn page-next">&gt;</button>
                <span class="jump-to-label">跳至</span>
                <input type="number" class="jump-to-input" value="1" min="1">
                <span class="jump-to-label">页</span>
            </div>
        </div>

        <!-- 右侧患者详情 -->
            <div class="right-panel">
            <!-- 患者摘要 -->
            <div class="patient-summary">
                <div id="patientOverviewCard"></div>
            </div>

            <!-- 序列树 -->
            <div class="sequence-tree-container" id="patientSequenceContainer">
                <!-- 序列树组件将通过JavaScript动态加载 -->
                <div class="loading-indicator">
                    <i class="fas fa-spinner fa-spin"></i>
                    <span>加载序列树组件...</span>
                </div>
            </div>

            <!-- 文件信息 -->
            <div class="file-info" id="fileInfoHost"></div>
        </div>
        </div><!-- 关闭 main-content-wrapper -->
        
        <!-- 统一的底部操作栏 -->
        <div class="bottom-action-bar">
            <div class="left-actions">
                <button class="btn btn-primary" id="importPatientBtn">导入</button>
                <button class="btn btn-secondary">导出</button>
                <button class="btn btn-danger">删除</button>
                <button class="btn btn-secondary">编辑</button>
            </div>
            <div class="right-actions">
                <button class="btn btn-primary btn-open">打开</button>
            </div>
        </div>
    </div>

    <!-- 组件引用 -->
    <script src="../../shared/scripts/MoziInstantTip.js?v=1"></script>
    <script src="../../shared/scripts/CurrentPatient.js?v=2"></script>
    <script src="../../shared/scripts/components/PatientOverviewComponent.js?v=6"></script>
    <script src="../../shared/scripts/components/FileInfoComponent.js?v=1"></script>
    <script src="../../shared/scripts/components/SequenceTreeComponent.js?v=ui2"></script>
    <script src="../../shared/scripts/components/RegistrationPanel.js"></script>
    <script src="../../shared/scripts/components/PatientManagementComponent.js"></script>
    <script src="../../shared/scripts/components/ImportLegacyModalComponent.js"></script>
    
    <script>
        // 模拟患者数据
        const mockPatients = [
            {
                id: '0000576304',
                name: 'Dong, Wuping',
                gender: 'M',
                birthDate: '1973-03-07',
                age: 52,
                doctor: 'Dr. Wang',
                physicist: 'Liu Ming',
                importTime: '2019.01.21 13:23:12',
                saveTime: '2019.01.21 13:23:12',
                remarks: 'Y0139-RECTUM'
            },
            {
                id: 'WP4TR3',
                name: 'Li Shan',
                gender: 'F',
                birthDate: '1976-06-13',
                age: 48,
                doctor: 'Dr. Chen',
                physicist: 'Zhang Wei',
                importTime: '2019.01.15 10:15:30',
                saveTime: '2019.01.20 16:45:20',
                remarks: 'Cervical Cancer'
            },
            {
                id: 'PA001234',
                name: 'Wang, Xiaoming',
                gender: 'M',
                birthDate: '1985-03-20',
                age: 39,
                doctor: 'Dr. Li',
                physicist: 'Chen Jing',
                importTime: '2019.02.10 09:30:00',
                saveTime: '2019.02.15 14:20:00',
                remarks: 'Prostate Cancer'
            },
            {
                id: 'PB005678',
                name: 'Zhang, Mei',
                gender: 'F',
                birthDate: '1990-08-15',
                age: 34,
                doctor: 'Dr. Liu',
                physicist: 'Wang Lei',
                importTime: '2019.03.05 11:45:00',
                saveTime: '2019.03.08 10:30:00',
                remarks: 'Breast Cancer'
            },
            {
                id: 'PC009876',
                name: 'Liu, Qiang',
                gender: 'M',
                birthDate: '1968-12-01',
                age: 56,
                doctor: 'Dr. Zhou',
                physicist: 'Zhao Min',
                importTime: '2019.04.12 15:20:00',
                saveTime: '2019.04.18 09:10:00',
                remarks: 'Lung Cancer'
            }
        ];
        
        let patientOverviewComponent = null;
        let importLegacyModal = null;

        function toPatientOverviewData(patient) {
            if (!patient) return window.CurrentPatient.get();
            return CurrentPatient.normalize({
                name: patient.name,
                id: patient.id,
                birthDate: (patient.birthDate || '').replace(/-/g, ''),
                gender: patient.gender || '',
                machine: patient.machine
            });
        }

        // 加载患者数据到表格
        function loadPatientData() {
            const tbody = document.getElementById('patientTableBody');
            if (!tbody) return;
            
            const currentId = (window.CurrentPatient && CurrentPatient.get().id) || mockPatients[0].id;
            tbody.innerHTML = mockPatients.map((patient, index) => `
                <tr class="${patient.id === currentId ? 'selected' : ''}" onclick="selectPatient(this, ${index})">
                    <td><i class="fas fa-folder"></i></td>
                    <td>${patient.id}</td>
                    <td>${patient.name}</td>
                    <td>${patient.gender}</td>
                    <td>${patient.birthDate}</td>
                    <td>${patient.age}</td>
                    <td>${patient.doctor}</td>
                    <td>${patient.physicist}</td>
                    <td>${patient.importTime}</td>
                    <td>${patient.saveTime}</td>
                    <td>${patient.remarks}</td>
                </tr>
            `).join('');
        }
        
        // 选择患者
        function selectPatient(row, index) {
            // 移除所有选中状态
            const rows = document.querySelectorAll('.patient-table tbody tr');
            rows.forEach(r => r.classList.remove('selected'));
            
            // 添加选中状态
            row.classList.add('selected');
            
            // 更新右侧患者信息
            const patient = mockPatients[index];
            if (patient) {
                const data = toPatientOverviewData(patient);
                if (window.CurrentPatient) CurrentPatient.set(data);
                if (patientOverviewComponent) {
                    patientOverviewComponent.setPatient(data);
                }
            }
        }
        let fileInfoComponent = null;
        function clientPrefix() {
            const path = location.pathname || '';
            if (path.includes('proton-client')) return 'proton-';
            if (path.includes('brachy-client')) return 'brachy-';
            return 'photon-';
        }

        function updateFileInfo(type) {
            if (fileInfoComponent) fileInfoComponent.setType(type);
        }

        // 选择树节点
        function selectTreeNode(element, type) {
            // 移除所有选中状态
            const allTreeLines = document.querySelectorAll('.tree-line');
            allTreeLines.forEach(line => line.classList.remove('selected'));

            // 添加选中状态
            element.classList.add('selected');

            // 更新文件信息
            updateFileInfo(type);
        }

        // 序列树组件实例
        let patientSequenceTreeComponent = null;

        // 初始化序列树组件
        function initializeSequenceTree() {
            const container = document.getElementById('patientSequenceContainer');
            if (!container) return;

            // 移除加载指示器
            container.innerHTML = '';

            // 使用 SequenceTreeComponent 组件
            if (window.SequenceTreeComponent) {
                patientSequenceTreeComponent = new SequenceTreeComponent('patientSequenceContainer', {
                    prefix: 'patient-',
                    onSequenceSelect: function(sequenceName, element) {
                        console.log('患者管理序列选择:', sequenceName);
                        // 点击文件夹时不更新文件信息，保持原有内容不变
                        // 只有点击文件节点时才更新文件信息
                    },
                    onFileSelect: function(fileName, element) {
                        console.log('患者管理文件选择:', fileName);
                        // 可以根据文件类型更新文件信息
                        const fileType = element.getAttribute('data-type') || 'CT';
                        updateFileInfo(fileType);
                    },
                    showFileInfo: false // 患者管理模块已有独立的文件信息显示区域
                });
            } else {
                console.error('SequenceTreeComponent 未加载');
            }
        }
        
        function initializeImportButton() {
            const importBtn = document.getElementById('importPatientBtn');
            if (!importBtn) return;

            importBtn.addEventListener('click', function() {
                if (typeof ImportLegacyModalComponent === 'undefined') {
                    console.warn('ImportLegacyModalComponent 未加载');
                    return;
                }
                if (!importLegacyModal) {
                    importLegacyModal = new ImportLegacyModalComponent({
                        mountContainer: document.body,
                        defaultTab: 'remote'
                    });
                }
                if (importLegacyModal.root) return;
                importLegacyModal.show();
            });
        }
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化患者概览组件
            const initialPatient = toPatientOverviewData(
                mockPatients.find((item) => item.id === CurrentPatient.get().id) || mockPatients[0]
            );
            CurrentPatient.set(initialPatient);
            patientOverviewComponent = new PatientOverviewComponent('patientOverviewCard', {
                patient: initialPatient
            });

            fileInfoComponent = new FileInfoComponent('fileInfoHost', {
                type: 'CT',
                prefix: clientPrefix()
            });

            loadPatientData();
            initializeSequenceTree();
            initializeImportButton();
        });
    </script>
</body>
</html>
