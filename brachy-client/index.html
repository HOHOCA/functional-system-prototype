<!DOCTYPE html>
<html lang="zh-CN" class="mozi-app">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOZI Brachy - 后装治疗计划系统</title>
    <link rel="stylesheet" href="../shared/styles/styles.css?v=ui19">
    <link rel="stylesheet" href="../shared/styles/mozi-chrome.css?v=ui7">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="top-nav">
            <div class="nav-left">
                <div class="logo" title="MOZI Brachy">
                    <span class="logo-wordmark" aria-hidden="true"></span>
                    <span class="logo-version">BRACHY</span>
                </div>
                <div class="nav-icons">
                    <button class="nav-icon-btn" id="navWorkflowBtn" title="工作流">
                        <img src="../shared/assets/icons/ui/chrome-workflow.png" alt="">
                    </button>
                    <button class="nav-icon-btn" id="navSaveBtn" title="保存">
                        <img src="../shared/assets/icons/ui/chrome-save.png" alt="">
                    </button>
                    <button class="nav-icon-btn" id="navCloseBtn" title="关闭">
                        <img src="../shared/assets/icons/ui/chrome-close-case.png" alt="">
                    </button>
                    <button class="nav-icon-btn" id="navUndoBtn" title="撤销">
                        <img src="../shared/assets/icons/ui/chrome-undo.png" alt="">
                    </button>
                    <button class="nav-icon-btn" id="navRedoBtn" title="恢复">
                        <img src="../shared/assets/icons/ui/chrome-redo.png" alt="">
                    </button>
                </div>
            </div>

            <div class="nav-center">
                <nav class="main-nav">
                    <a href="#" class="nav-item active" data-module="patient">患者管理</a>
                    <a href="#" class="nav-item" data-module="image">图像处理</a>
                    <a href="#" class="nav-item" data-module="target">靶区勾画</a>
                    <a href="#" class="nav-item" data-module="plan">计划设计</a>
                    <a href="#" class="nav-item" data-module="evaluation">计划评估</a>
                </nav>
            </div>

            <div class="nav-right">
                <button type="button" class="physics-module-btn" id="physicsModuleBtn" title="物理模块" aria-label="物理模块">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <ellipse cx="8" cy="8" rx="6.5" ry="2.4" stroke="currentColor" stroke-width="1.4"/>
                        <ellipse cx="8" cy="8" rx="6.5" ry="2.4" stroke="currentColor" stroke-width="1.4" transform="rotate(60 8 8)"/>
                        <ellipse cx="8" cy="8" rx="6.5" ry="2.4" stroke="currentColor" stroke-width="1.4" transform="rotate(120 8 8)"/>
                        <circle cx="8" cy="8" r="1.4" fill="currentColor"/>
                    </svg>
                </button>
                <button class="nav-icon-btn" id="navSettingsBtn" title="系统设置">
                    <img src="../shared/assets/icons/ui/chrome-settings.png" alt="">
                </button>
                <span class="nav-divider"></span>
                <div class="user-profile">
                    <img src="../shared/assets/icons/ui/chrome-user.png" alt="">
                    <span>mpadmin</span>
                </div>
                <span class="nav-divider"></span>
                <div class="window-controls">
                    <button class="window-control-btn" title="最小化">
                        <img src="../shared/assets/icons/ui/chrome-minimize.png" alt="">
                    </button>
                    <button class="window-control-btn maximize-btn" title="最大化">
                        <img src="../shared/assets/icons/ui/chrome-maximize.png" alt="">
                    </button>
                    <button class="window-control-btn close-btn" title="关闭">
                        <img src="../shared/assets/icons/ui/chrome-close-window.png" alt="">
                    </button>
                </div>
            </div>
        </header>

        <main class="main-content">
            <iframe id="patientFrame" class="module-frame active" src="modules/patient-management-module.html?v=ui8" loading="lazy"></iframe>
            <iframe id="imageFrame" class="module-frame" src="modules/image-processing-module.html?v=ui8" loading="lazy"></iframe>
            <iframe id="targetFrame" class="module-frame" src="modules/target-delineation-module.html?v=ui8" loading="lazy"></iframe>
            <iframe id="planFrame" class="module-frame" src="modules/plan-design-module.html?v=ui8" loading="lazy"></iframe>
            <iframe id="evaluationFrame" class="module-frame" src="modules/plan-evaluation-module.html?v=ui8" loading="lazy"></iframe>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const navItems = document.querySelectorAll('.nav-item');
            const moduleFrames = document.querySelectorAll('.module-frame');
            const settingsBtn = document.getElementById('navSettingsBtn');

            const moduleFrameMap = {
                'patient': 'patientFrame',
                'image': 'imageFrame',
                'target': 'targetFrame',
                'plan': 'planFrame',
                'evaluation': 'evaluationFrame'
            };

            navItems.forEach(item => {
                item.addEventListener('click', function(e) {
                    e.preventDefault();
                    const moduleName = this.getAttribute('data-module');
                    const frameId = moduleFrameMap[moduleName];
                    if (!frameId) return;
                    navItems.forEach(nav => nav.classList.remove('active'));
                    this.classList.add('active');
                    moduleFrames.forEach(frame => frame.classList.remove('active'));
                    document.getElementById(frameId).classList.add('active');
                });
            });

            if (settingsBtn) {
                settingsBtn.addEventListener('click', function() {
                    window.location.href = '../shared/modules/system-settings.html';
                });
            }

            const physicsModuleBtn = document.getElementById('physicsModuleBtn');
            if (physicsModuleBtn) {
                physicsModuleBtn.addEventListener('click', function() {
                    window.location.href = './modules/physics-module.html';
                });
            }

            document.getElementById('navWorkflowBtn').addEventListener('click', function() {
                console.log('工作流按钮点击');
            });
            document.getElementById('navSaveBtn').addEventListener('click', function() {
                console.log('保存按钮点击');
            });
            document.getElementById('navCloseBtn').addEventListener('click', function() {
                console.log('关闭按钮点击');
            });
            document.getElementById('navUndoBtn').addEventListener('click', function() {
                console.log('撤销按钮点击');
            });
            document.getElementById('navRedoBtn').addEventListener('click', function() {
                console.log('恢复按钮点击');
            });

            document.querySelectorAll('.window-control-btn').forEach((btn) => {
                btn.addEventListener('click', function() {
                    if (this.classList.contains('close-btn')) {
                        window.location.href = '../index.html';
                    } else if (this.classList.contains('maximize-btn')) {
                        if (!document.fullscreenElement) {
                            document.documentElement.requestFullscreen?.();
                        } else {
                            document.exitFullscreen?.();
                        }
                    } else {
                        alert('最小化窗口');
                    }
                });
            });
        });
    </script>
    <script src="../shared/scripts/MoziInstantTip.js?v=1"></script>
</body>
</html>
